<!--
  この広告スロット用の単一の入札者を呼び出すページです。
  Google Publisher Tagを使用したPrebidの「ハローワールド」の例と考えることができます。
  新しいアダプターのテストページとしても適しています。
-->

<html>
   <head>
       <meta charset="UTF-8">
       
       <script async src="../../build/dev/prebid.js"></script>
       <script async src="https://www.googletagservices.com/tag/js/gpt.js"></script>
       
       <script>
           var FAILSAFE_TIMEOUT = 3300;
           var PREBID_TIMEOUT = 3000;
   
           var adUnits = [{
               code: 'div-gpt-ad-1460505748561-0',
               mediaTypes: {
                   banner: {
                       sizes: [[728,90]],
                   }
               },            
               // Replace this object to test a new Adapter!
               bids: [{
                       bidder: 'pubmatic',
                       params: {
                           publisherId: '103207222',
                           adUnit: 'TestAdUnit'
                       },
                   }
               ]
           }];
   
           var pbjs = pbjs || {};
           pbjs.que = pbjs.que || [];
   
       </script>
   
       <script>
           var googletag = googletag || {};
           googletag.cmd = googletag.cmd || [];
           googletag.cmd.push(function() {
               googletag.pubads().disableInitialLoad();
           });
   
           pbjs.que.push(function() {
   
            pbjs.setConfig({
            "realTimeData": {
                "dataProviders": [{
                    name: 'SirdataRTDModule',
                    waitForIt: true,
                    params: {
                        setGptKeyValues: true,
                        partnerId: 1,
                        key: 1
                    }
                }]
            },
            "bidderTimeout": 3500,
            
        });

               pbjs.addAdUnits(adUnits);
               pbjs.requestBids({
                   bidsBackHandler: sendAdserverRequest,
                   timeout: PREBID_TIMEOUT
               });
           });
   
           function sendAdserverRequest() {
               if (pbjs.adserverRequestSent) return;
               pbjs.adserverRequestSent = true;
               googletag.cmd.push(function() {
                   pbjs.que.push(function() {
                       pbjs.setTargetingForGPTAsync();
                       googletag.pubads().refresh();
                   });
               });
           }
   
           setTimeout(function() {
               sendAdserverRequest();
           }, FAILSAFE_TIMEOUT);
   
       </script>
   
       <script>
           googletag.cmd.push(function () {
               googletag.defineSlot('/199622228336/test-adunit', [[728, 90], [300, 250]], 'div-gpt-ad-1460505748561-0').addService(googletag.pubads());
   
               googletag.pubads().enableSingleRequest();
               googletag.enableServices();
           });
       </script>
   </head>
   
   <body>
   <div id='div-gpt-ad-1460505748561-0' style="width:100%; height:300px; background-color: #faf2f3;">
       <script type='text/javascript'>
           googletag.cmd.push(function() { googletag.display('div-gpt-ad-1460505748561-0'); });
       </script>
   </div>

   </body>
   </html>
