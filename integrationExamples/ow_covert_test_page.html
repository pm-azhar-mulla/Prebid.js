  <!-- javascript -->
  <script>

var pbjs = pbjs || {};
pbjs.que = pbjs.que || [];


pbjs.que.push(function() {
    var PWT = window.PWT || {};
    var obj = {
        adUnits:[{
                    code: 'test-div',ortb2Imp: {tagId: '/43743431/DMDemo', ext:{'abvc':123}},
                    mediaTypes: {banner: {sizes: [[300,250]]}}
                }],
        publisherId: "5890",

        bidders: ['pubmatic'],
        timeout: 1000,
        adapter: 'prebidServer',
        endpoint: 'https://prebid-server.pubmatic.com/prebidserver/auction',
        profileid : 47667,
        versionid: 333,
        keywords: {
            'adButler1': 123
        }
    }
    PWT.requestConvertServer(obj);
    pbjs.requestBids({
        timeout: 2000,
        bidsBackHandler: PWT.renderAllAdUnits
    });
});



</script>
