<html>

<head>
    <meta charset="UTF-8">
    <title>PubMatic adapter multi imp testing</title>
    <script async src="../../build/dev/prebid.js"></script>
    <script async src="https://www.googletagservices.com/tag/js/gpt.js"></script>

    <script>
        var FAILSAFE_TIMEOUT = 3300;
        var PREBID_TIMEOUT = 3000;

        var adUnits = [
        {
            "code": "div1",
            "sizes": [
                [728, 90],
                [300, 250]
            ],
            "mediaTypes": {
                "banner": {
                    "sizes": [
                        [728, 90],
                        [300, 250]
                    ]
                }
            },
            "bids": [{
                "bidder": "pubmatic",
                "size": [
                    [728, 90]
                ],
                "params": {
                    "publisherId": "164392",
                    "adSlot": "test_singleimp_728x90@728x90",
                    "pmzoneid": "123"
                }
            }, {
                "bidder": "pubmatic",
                "size": [
                    [300, 250]
                ],
                "params": {
                    "publisherId": "164392",
                    "adSlot": "test_singleimp_300x250@300x250",
                    "yob": "123",
                    "gender": "M2",
                    "bcat": "IAB2",
                    "dctr": "key1=v22|key2=v22",
                    "deals": ['PUBDEAL-MP']
                }
            }]
        },{
            "code": "div1",
            "mediaTypes": {
                "banner": {
                    "sizes": [
                        [640, 480]
                    ]
                }
            },
            "bids": [{
                "bidder": "pubmatic",
                "params": {
                    "publisherId": "164392",
                    "adSlot": "test_singleimp_640x480@640x480"
                }

            }]
        },
        {
            "code": "div1",
            "mediaTypes": {
            "banner": {
                "sizes": [
                    [160, 600]
                ]
            },
            "video": {
                "playerSize": [640, 480],
                "context": 'instream',
                "mimes": ['video/mp4', 'video/x-flv'],
                "skippable": 0,
                "minduration": 1,
                "maxduration": 30,
                "startdelay": 15,
                "playbackmethod": [1, 3],
                "api": [1, 2],
                "protocols": [2, 3],
                "w": 640,
                "h": 480,
                "battr": [13, 14],
                "linearity": 1,
                "placement": 2,
                "plcmt": 2,
                "minbitrate": 100,
                "maxbitrate": 4096
            }
            },
            "bids": [{
                "bidder": "pubmatic",
                "params": {
                    "publisherId": "164392",
                    "adSlot": "test_singleimp_160x600@160x600"
                }

            },
            {
                "bidder": "pubmatic",
                "params": {
                    "publisherId": "164392",
                    "adSlot": "test_singleimp_640x480@640x480"
                }

            }]
        }
    ];

        var pbjs = pbjs || {};
        pbjs.que = pbjs.que || [];
    </script>

    <script>
        var googletag = googletag || {};
        googletag.cmd = googletag.cmd || [];
        googletag.cmd.push(function () {
            googletag.pubads().disableInitialLoad();
        });

        pbjs.que.push(function () {

            pbjs.setConfig({
                enableTIDs: true,
                floors: {
                    enabled: true,
                    data: {
                        currency: 'USD',
                        schema: {
                            delimiter: '|',
                            fields: ['mediaType', 'size']
                        },
                        values: {
                            'banner|728x90': 1,
                            'banner|300x250': 2,
                            'banner|160x600': 3,
                        }
                    }
                }
            });
            
            pbjs.addAdUnits(adUnits);
            pbjs.requestBids({
                bidsBackHandler: sendAdserverRequest,
                timeout: PREBID_TIMEOUT
            });
        });

        function sendAdserverRequest() {
            if (pbjs.adserverRequestSent) return;
            pbjs.adserverRequestSent = true;
            googletag.cmd.push(function () {
                pbjs.que.push(function () {
                    pbjs.setTargetingForGPTAsync();
                    googletag.pubads().refresh();
                });
            });
        }

        setTimeout(function () {
            sendAdserverRequest();
        }, FAILSAFE_TIMEOUT);
    </script>

    <script>
        googletag.cmd.push(function () {
            googletag.defineSlot('/43743431/DMDemo', [
                [728, 90],
                [300, 250],
                [160, 600]
            ], 'div1').addService(googletag.pubads());
            googletag.defineSlot('/43743431/DMDemo1', [
                [728, 90],
                [300, 250],
                [160, 600]
            ], 'div2').addService(googletag.pubads());
            googletag.pubads().enableSingleRequest();
            googletag.enableServices();
        });
    </script>
</head>

<body>
    <h1>Test page</h1>
    <h2>PM request testing</h2>
    <div id='div1'>
        <script type='text/javascript'>
            googletag.cmd.push(function () {
                googletag.display('div1');
            });
        </script>
    </div>
    <div id='div2'>
        <script type='text/javascript'>
            googletag.cmd.push(function () {
                googletag.display('div2');
            });
        </script>
    </div>
</body>

</html>
