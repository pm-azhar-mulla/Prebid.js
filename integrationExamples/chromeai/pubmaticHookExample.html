<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PubMatic Hook Example - Prebid.js</title>
    <!-- Load the dynamic extensions for schema fields -->
    <!-- <script src="dynamicCode.js"></script> -->
    
    
    <!-- First load Prebid.js with sync attribute to ensure it's fully loaded -->
    <script async src="../../build/dev/prebid.js"></script>
    <!-- <script src="./hookwithRTD.js?ns=pbjs"></script> -->
    <!-- Then load PubMatic Hook after Prebid is available -->
    <!-- <script src="pubmaticHook.js?ns=pbjs"></script> -->
     
    
    <!-- Load GPT -->
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    
    <script>
        var pbjs = pbjs || {};
        pbjs.que = pbjs.que || [];
        var googletag = googletag || {};
        googletag.cmd = googletag.cmd || [];
        
        // Configure Prebid
        pbjs.que.push(function() {
            pbjs.setConfig({
                debug: true,
                // PubMatic specific configuration
                realTimeData: {
                    auctionDelay: 200,
                    dataProviders: [{
                        name: "pubmatic",
                        waitForIt: true,
                        params: {
                            publisherId: '12345',  // Replace with your Pubmatic publisher ID
                            profileId: 1234,       // Replace with your profile ID
                            profileVersionId: 1,
                        }
                    }]
                }
            });
            pbjs.enableAnalytics({
                    provider: 'pubmatic',
                    options: {
                        "publisherId": 12345 // please contact PubMatic to get a publisherId for yourself
                    }
                });
            //pbjs.setConfig({floors: {enabled: true}})
            // Define ad units
            refreshAd()
            
        });
        
        // GPT setup
        googletag.cmd.push(function() {
            googletag.pubads().disableInitialLoad();
            googletag.defineSlot('/19968336/header-bid-tag-0', [[300, 250], [300, 600]], 'div-gpt-ad-1')
                .addService(googletag.pubads());
            googletag.pubads().enableSingleRequest();
            googletag.enableServices();
        });
        function refreshAd(){
            pbjs.removeAdUnit();
            var adUnits = [{
                code: 'div-gpt-ad-1',
                mediaTypes: {
                    banner: {
                        sizes: [[300, 250], [300, 600]]
                    }
                },
                bids: [{
                    bidder: 'appnexus',
                    params: {
                        placementId: 13144370
                    }
                }, {
                    bidder: 'pubmatic',
                    params: {
                        publisherId: '123456',
                        adSlot: 'test@300x250'
                    }
                }]
            }];
            
            // Add ad units
            pbjs.addAdUnits(adUnits);
            
            // Request bids - this will automatically trigger our hook
            console.log("Azzi123 requestBids called from html page");
            setTimeout(function(){
                pbjs.requestBids({
                    bidsBackHandler: function(bidResponses) {
                        console.log('Bids returned:', bidResponses);
                        // Log floor data to verify hook worked
                        console.log('Floor data after hook:', pbjs.getConfig('floors'));
                        // Set targeting and refresh
                        googletag.cmd.push(function() {
                            pbjs.setTargetingForGPTAsync();
                            googletag.pubads().refresh();
                        });
                    }
                });
            }, 0);
        }
    </script>
    
    <style>
        .ad-container {
            width: 300px;
            height: 250px;
            border: 1px solid #ccc;
            margin: 20px auto;
            position: relative;
        }
        h1, h2, p {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .code-example {
            max-width: 800px;
            margin: 20px auto;
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>PubMatic Hook Example</h1>
    <p>Demonstrates using hooks along with RTD provider</p>

    <div class="ad-container">
        <div id="div-gpt-ad-1">
            <!-- Ad will be rendered here -->
        </div>
    </div>
    <button onclick="refreshAd()">Refresh</button>
    
    
    <script>
        // Display hook status
        pbjs.que.push(function() {
            setTimeout(function() {
                console.log('Hook status check:', {
                    floorsConfigured: !!pbjs.getConfig('floors'),
                    dynamicExtensionAvailable: !!window.PubmaticRtdExtensions
                });
                
                if (window.PubmaticHook) {
                    console.log('PubMatic Hook was loaded successfully');
                }
            }, 2000);
        });
    </script>
</body>
</html>
